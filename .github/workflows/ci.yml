name: unit-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: "python -m pip install --only-binary=:all: -r requirements-lock.txt"
      - run: python -m pytest tests -q
      - run: python scripts/verify_manifest.py
      - run: python scripts/verify_public_release.py --output results/ci_public_replay
      - run: python scripts/run_reviewer_revision.py --smoke --output results/ci_controlled_smoke
      - run: python -m reviewer_revision.verify results/ci_controlled_smoke
